services:
  - type: web
    name: macgly
    runtime: node
    buildCommand: cd apps/web && npm install --include=dev && npm run build && cd ../api && npm install
    startCommand: node apps/api/src/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Distinct from RAZORPAY_KEY_SECRET. Copy it from the Razorpay dashboard
      # webhook settings — the API boots only when this is present.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # The code calls api.resend.com; MAILERSEND_API_KEY was never read.
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CSRF_SECRET
        generateValue: true
      # Printed on tax invoices. Left blank renders "GSTIN not on record".
      - key: PLATFORM_GSTIN
        sync: false
